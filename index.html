async function comprimir(file){
  if(!file.type.startsWith("image/")) return file;
  try{
    const bmp = await createImageBitmap(file, {imageOrientation:"from-image"});
    const max = 1600, k = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    return blob || file;
  }catch(e){ return file; }
}
async function subirPrueba(retoId, file){
  if(!file) return;
  const esVideo = file.type.startsWith("video/");
  if(esVideo && file.size > 50*1024*1024){ toast("El vídeo pesa demasiado. Grábalo de menos de 20 segundos."); return; }
  const m = Number(retoId.slice(1).split("-")[0]);
  subiendo[retoId] = {estado:"up", msg:"Subiendo…"}; render();
  const cuerpo = await comprimir(file);
  const ext = esVideo ? (file.name.split(".").pop()||"mp4").toLowerCase() : "jpg";
  const path = `mesa${m}/${retoId}_${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
  let ok=false, err;
  for(let i=0;i<3 && !ok;i++){
    const {error} = await sb.storage.from(BUCKET).upload(path, cuerpo, {contentType: esVideo ? file.type : "image/jpeg", upsert:true});
    if(!error) ok=true; else { err=error; subiendo[retoId]={estado:"up",msg:`Reintentando (${i+2}/3)…`}; render(); await new Promise(r=>setTimeout(r,1500*(i+1))); }
  }
  if(ok){
    const {error} = await sb.from("pruebas").insert({reto_id:retoId, mesa:m, jugador_id:yo.id, foto_path:path, es_video:esVideo});
    if(error){ ok=false; err=error; }
  }
  if(ok){ subiendo[retoId]={estado:"ok",msg:"¡Listo! Ya está en la galería"}; toast("¡Reto cumplido! 🎉"); refrescar("pruebas"); setTimeout(()=>{delete subiendo[retoId]; render();},4000); }
  else { subiendo[retoId]={estado:"err",msg:"No se ha podido subir. Comprueba el wifi y vuelve a intentarlo."}; console.error(err); }
  render();
}
function elegirArchivo(retoId){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="image/*,video/*";
  inp.onchange = () => subirPrueba(retoId, inp.files[0]);
  inp.click();
}
async function pedirReto(retoId){
  const m = Number(retoId.slice(1).split("-")[0]);
  const {error} = await sb.from("reclamos").insert({reto_id:retoId, mesa:m, jugador_id:yo.id});
  if(error){ await cargar("reclamos"); await cargar("jugadores"); const r=S.reclamos[retoId]; toast(r ? `Se lo ha pedido ${S.jugadores[r.jugador_id]?.nombre||"otra persona"}` : "No se ha podido, inténtalo otra vez"); }
  else toast("¡Es tuyo! Cuando lo hagas, sube la prueba");
  refrescar("reclamos");
}
async function votar(pruebaId){
  const {error} = await sb.from("votos").insert({jugador_id:yo.id, prueba_id:pruebaId});
  if(error){
    const msg = error.message||"";
    toast(msg.includes("propia mesa") ? "No puedes votar a tu propia mesa" : msg.includes("3 corazones") ? "Ya has usado tus 3 corazones" : msg.includes("duplicate") ? "Ya le has dado tu corazón" : "No se ha podido votar");
  } else toast("❤ Corazón enviado");
  refrescar("votos");
}

function vistaBienvenida(){
  return `
  <section class="welcome intro" onclick="this.classList.add('skip')">
    ${COUPLE_SVG}
    <h1 class="names rv" style="--r:4.1s">Cristina<span class="amp">&amp;</span>Sergio</h1>
    <div class="date rv" style="--r:4.3s">Sábado, 3 de octubre de 2026</div>
    <p class="hook rv" style="--r:4.7s">Esta noche hay retos.<br>¿Os atrevéis?</p>
    <ul class="rules rv" style="--r:5s">
      <li><b>Cumplir un reto</b> es tan fácil como subir una foto o un vídeo corto.</li>
      <li><b>Todo se ve en directo</b> en la galería, también lo que hacen las demás mesas.</li>
      <li><b>Dos premios:</b> la mesa que más retos complete y la foto más graciosa de la noche.</li>
    </ul>
    <div class="rv" style="--r:5.3s"><button class="btn block go" onclick="paso('nombre')">¡Vamos a jugar!</button></div>
  </section>`;
}
let tmpNombre = "";
function vistaNombre(){
  return `
  <section class="ask">
    <h2>¿Cómo te llamas?</h2>
    <p>Así sabremos quién ha hecho cada reto.</p>
    <input class="field" id="inNombre" maxlength="40" autocomplete="given-name" value="${esc(tmpNombre)}" placeholder="Tu nombre">
    <button class="btn block" id="bNombre" onclick="guardarNombre()">Siguiente</button>
  </section>`;
}
function vistaParentesco(){
  return `
  <section class="ask">
    <h2>¿Y qué eres de los novios, ${esc(tmpNombre)}?</h2>
    <p>Saldrá debajo de tus fotos en la galería.</p>
    <input class="field" id="inRel" maxlength="60" placeholder="Prima de Cristina">
    <div class="hint">Por ejemplo: cuñado de Sergio, amiga del instituto de Cristina…</div>
    <button class="btn block" id="bRel" onclick="guardarJugador()">Entrar al juego</button>
  </section>`;
}
function vistaElegirMesa(){
  return `
  <section class="ask">
    <h2>¿En qué mesa estás?</h2>
    <p>Lo normal es entrar escaneando el código de tu mesa. Si no, elígela aquí.</p>
    ${[1,2,3,4].map(m=>`<button class="btn ghost block" style="margin-top:10px" onclick="mesaURL=${m};paso('bienvenida')">Mesa ${m} · ${MESAS[m]}</button>`).join("")}
  </section>`;
}

function cabecera(){
  return `
  <header class="top">
    <h1 class="names">Cristina<span class="amp">&amp;</span>Sergio</h1>
    <div class="me"><b>${esc(yo.nombre)}</b>, ${esc(yo.parentesco)} · Mesa ${yo.mesa}, ${MESAS[yo.mesa]}</div>
  </header>
  <nav class="tabs" role="tablist">
    ${[["retos","Mi mesa"],["ranking","Ranking"],["galeria","Galería"]].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" onclick="tab='${k}';render();scrollTo(0,0)">${l}</button>`).join("")}
  </nav>`;
}

function tarjetaReto(r, esFinal=false){
  const pr = pruebasValidas().filter(p=>p.reto_id===r.id);
  const hecho = pr.length>0;
  const rec = S.reclamos[r.id];
  const recJ = rec ? S.jugadores[rec.jugador_id] : null;
  const esMio = rec && rec.jugador_id===yo.id;
  const up = subiendo[r.id];
  let foot = "";
  if(up){
    foot = `<span class="status ${up.estado}">${esc(up.msg)}</span>` + (up.estado==="err" ? `<button class="btn sm" onclick="elegirArchivo('${r.id}')">Reintentar</button>` : "");
  } else if(hecho){
    const autores=[...new Set(pr.map(p=>S.jugadores[p.jugador_id]?.nombre).filter(Boolean))];
    foot = `<span class="chip ok">Hecho</span><span class="who">por <b>${esc(autores.join(", ")||"vuestra mesa")}</b></span>
            <span class="thumbs">${pr.slice(0,3).map(p=>mediaTag(p,"")).join("")}</span>
            <button class="btn ghost sm" onclick="elegirArchivo('${r.id}')">Añadir otra</button>`;
  } else if(r.tipo==="mesa" || esFinal){
    foot = `<span class="chip">${esFinal?"Toda la boda":"Toda la mesa"}</span><button class="btn sm" onclick="elegirArchivo('${r.id}')">Subir prueba</button>`;
  } else if(esMio){
    foot = `<span class="who">Es tuyo</span><button class="btn gold sm" onclick="elegirArchivo('${r.id}')">Subir prueba</button>`;
  } else if(rec){
    foot = `<span class="who">Lo hace <b>${esc(recJ?.nombre||"alguien de tu mesa")}</b></span>`;
  } else {
    foot = `<button class="btn sm" onclick="pedirReto('${r.id}')">Me lo pido</button>`;
  }
  return `<article class="reto ${hecho?"done":""} ${esFinal?"final":""}">
    <div class="n">${esFinal?"★":(hecho?"✓":r.n)}</div>
    <div class="t">${esc(r.texto)}</div>
    <div class="foot">${foot}</div>
  </article>`;
}

function vistaRetos(){
  const m = yo.mesa, lista = retosDe(m);
  const apuntados = Object.values(S.jugadores).filter(j=>j.mesa===m).length;
  const hechos = completados(m), tot = totalRetos();
  const fin = {id:`m${m}-final`, texto:RETO_FINAL, tipo:"final"};
  return `
    ${S.finalAbierto ? `<h2 class="section-title">Reto final de toda la boda</h2>${tarjetaReto(fin,true)}` : ""}
    <div class="notice">Ya sois <b>${apuntados}</b> apuntados en la mesa y hay <b>10 retos</b>. Cada uno hace <b>mínimo un reto individual</b>, y los de mesa los hacéis todos juntos. Vosotros decidís quién hace qué.</div>
    <div class="progress-line">${hechos} de ${tot} retos cumplidos</div>
    <div class="bar"><i style="width:${Math.round(hechos/tot*100)}%"></i></div>
    <h2 class="section-title">Individuales</h2>
    ${lista.filter(r=>r.tipo==="individual").map(r=>tarjetaReto(r)).join("")}
    <h2 class="section-title">De mesa entera</h2>
    ${lista.filter(r=>r.tipo==="mesa").map(r=>tarjetaReto(r)).join("")}`;
}

function vistaRanking(){
  const tot = totalRetos();
  const filas = [1,2,3,4].map(m=>({m, c:completados(m)})).sort((a,b)=>b.c-a.c || a.m-b.m);
  return `
    <h2 class="section-title">¿Cómo van las mesas?</h2>
    ${filas.map(f=>`
      <div class="rank-row ${f.m===yo.mesa?"mine":""}">
        <div class="h"><span class="nm">${MESAS[f.m]}</span><span class="sc">${f.c} / ${tot}</span></div>
        <div class="bar"><i style="width:${Math.round(f.c/tot*100)}%"></i></div>
      </div>`).join("")}
    <div class="prizes">
      <p><b>Mesa más cumplidora:</b> la que más retos complete. No cuenta quién termina antes, y si empatan, ganan las dos.</p>
      <p><b>Mesa más graciosa:</b> Cristina y Sergio la eligen entre las 5 fotos con más corazones de la galería.</p>
    </div>`;
}

function vistaGaleria(){
  const lista = pruebasValidas();
  const quedan = MAX_HEARTS - misVotos().length;
  const votadas = new Set(misVotos().map(v=>v.prueba_id));
  const heart = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>`;
  return `
    <div class="hearts-left">Te quedan <b>${quedan} de ${MAX_HEARTS}</b> corazones. Úsalos en las fotos de otras mesas que más te gusten.</div>
    ${lista.length===0 ? `<div class="empty">Todavía no hay fotos.<br>¿Quién se estrena?</div>` :
      lista.map(p=>{
        const j = S.jugadores[p.jugador_id];
        const propia = p.mesa===yo.mesa, mia = votadas.has(p.id);
        const dis = propia || mia || quedan<=0;
        return `<figure class="photo" style="margin:0 0 16px">
          ${mediaTag(p)}
          <figcaption class="cap">
            <div><div class="by">${esc(j?.nombre||"Invitado")}</div><div class="rel">${esc(j?.parentesco||"")} · ${MESAS[p.mesa]||""}</div></div>
            <button class="heart ${mia?"on":""}" ${dis?"disabled":""} onclick="votar('${p.id}')" aria-label="${propia?"Es de tu mesa":"Dar un corazón"}">${heart}${votosDe(p.id)}</button>
            <div class="rt">${esc(textoReto(p.reto_id))}</div>
          </figcaption>
        </figure>`;}).join("")}`;
}

/* ============ ADMIN ============ */
let pin = sessionStorage.getItem("boda_cs_pin") || "";
async function adminLogin(){
  const v = $("#inPin").value.trim();
  const {data} = await sb.rpc("admin_check",{pin:v});
  if(data===true){ pin=v; sessionStorage.setItem("boda_cs_pin",v); render(); } else toast("PIN incorrecto");
}
async function adminCall(fn, args){
  const {error} = await sb.rpc(fn, {pin, ...args});
  if(error) toast("Error: "+error.message); else toast("Hecho");
  await cargar(); render();
}
async function descargarTodo(){
  const btn = $("#bZip"); btn.disabled = true;
  if(!window.JSZip){ await new Promise((ok,ko)=>{const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload=ok; s.onerror=ko; document.head.appendChild(s);}); }
  const zip = new JSZip(); let i=0;
  for(const p of S.pruebas){
    i++; btn.textContent = `Descargando ${i}/${S.pruebas.length}…`;
    try{
      const b = await (await fetch(fotoURL(p.foto_path))).blob();
      const j = S.jugadores[p.jugador_id];
      const nom = `${(MESAS[p.mesa]||"mesa").replace(/\s+/g,"-")}/${p.reto_id}_${(j?.nombre||"inv").replace(/[^\wáéíóúñ-]/gi,"")}_${i}.${p.foto_path.split(".").pop()}`;
      zip.file((p.anulada?"anuladas/":"")+nom, b);
    }catch(e){ console.error(e); }
  }
  btn.textContent = "Preparando el archivo…";
  const out = await zip.generateAsync({type:"blob"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(out); a.download = "boda-cristina-sergio.zip"; a.click();
  btn.disabled=false; btn.textContent="Descargar todas las fotos";
}
function vistaAdmin(){
  if(!pin) return `<section class="ask"><h2>Panel del organizador</h2><p>Introduce tu PIN.</p>
    <input class="field" id="inPin" inputmode="numeric" maxlength="6" placeholder="······">
    <button class="btn block" onclick="adminLogin()">Entrar</button></section>`;
  const top = pruebasValidas().map(p=>({p,v:votosDe(p.id)})).sort((a,b)=>b.v-a.v).slice(0,5);
  const cell = (p,extra="") => { const j=S.jugadores[p.jugador_id]; return `<div class="cell ${p.anulada?"off":""}">${mediaTag(p)}<div class="i"><b>${esc(j?.nombre||"")}</b> · Mesa ${p.mesa}<br>${esc(textoReto(p.reto_id)).slice(0,60)}…<br>${extra}</div></div>`; };
  return `<section class="admin">
    <header class="top"><h1 class="names">Cristina<span class="amp">&amp;</span>Sergio</h1><div class="me">Panel del organizador</div></header>
    <h2>Marcador</h2>
    ${[1,2,3,4].map(m=>`<div class="claim"><span>${MESAS[m]}</span><b>${completados(m)} / ${totalRetos()}</b></div>`).join("")}
    <h2>Reto final</h2>
    <p>${S.finalAbierto?"Abierto: todas las mesas lo ven.":"Cerrado. Ábrelo justo antes de dar los premios."}</p>
    <div class="row"><button class="btn ${S.finalAbierto?"ghost":"gold"}" onclick="adminCall('admin_reto_final',{abierto:${!S.finalAbierto}})">${S.finalAbierto?"Cerrar reto final":"Abrir reto final"}</button></div>
    <h2>Las 5 más votadas</h2>
    <p>Para que los novios elijan la mesa más graciosa.</p>
    <div class="grid">${top.map(({p,v})=>cell(p,`❤ ${v}`)).join("") || "<p>Aún no hay votos.</p>"}</div>
    <h2>Retos pedidos</h2>
    <p>Si alguien se pide un reto y no lo hace, suéltalo aquí.</p>
    ${Object.values(S.reclamos).map(r=>`<div class="claim"><span>Mesa ${r.mesa} · ${esc(S.jugadores[r.jugador_id]?.nombre||"")}: ${esc(textoReto(r.reto_id)).slice(0,50)}…</span><button class="btn ghost sm" onclick="adminCall('admin_soltar_reto',{p_reto:'${r.reto_id}'})">Soltar</button></div>`).join("") || "<p>Ninguno todavía.</p>"}
    <h2>Todas las pruebas</h2>
    <div class="row"><button class="btn" id="bZip" onclick="descargarTodo()">Descargar todas las fotos</button></div>
    <div class="grid">${S.pruebas.map(p=>cell(p,`<button class="btn ghost sm" style="margin-top:6px" onclick="adminCall('admin_anular',{p_id:'${p.id}',p_anulada:${!p.anulada}})">${p.anulada?"Recuperar":"Anular"}</button>`)).join("")}</div>
  </section>`;
}

/* ============ FLUJO ============ */
let fase = "bienvenida";
function paso(f){ fase=f; render(); scrollTo(0,0); setTimeout(()=>{ const i=document.querySelector(".field"); if(i) i.focus(); },50); }
function guardarNombre(){
  const v = $("#inNombre").value.trim();
  if(!v){ toast("Escribe tu nombre"); return; }
  tmpNombre = v.charAt(0).toUpperCase()+v.slice(1); paso("parentesco");
}
async function guardarJugador(){
  const rel = $("#inRel").value.trim();
  if(!rel){ toast("Cuéntanos qué eres de los novios"); return; }
  const b = $("#bRel"); b.disabled=true; b.textContent="Entrando…";
  const {data,error} = await sb.from("jugadores").insert({nombre:tmpNombre, parentesco:rel, mesa:mesaURL}).select().single();
  if(error){ b.disabled=false; b.textContent="Entrar al juego"; toast("No se ha podido entrar. Comprueba el wifi."); return; }
  yo = data; localStorage.setItem("boda_cs_jugador", JSON.stringify(yo));
  await cargar(); fase="juego"; render(); scrollTo(0,0);
}
document.addEventListener("keydown", e=>{
  if(e.key!=="Enter") return;
  if(document.activeElement?.id==="inNombre") guardarNombre();
  else if(document.activeElement?.id==="inRel") guardarJugador();
  else if(document.activeElement?.id==="inPin") adminLogin();
});

function render(){
  const app = $("#app");
  if(isAdmin){ app.innerHTML = vistaAdmin(); return; }
  if(yo && fase!=="juego") fase = "juego";
  if(fase==="juego" && yo){
    app.dataset.k = "";
    if(!S.loaded){ app.innerHTML = cabecera() + `<div class="empty">Cargando…</div>`; return; }
    app.innerHTML = cabecera() + (tab==="retos"?vistaRetos():tab==="ranking"?vistaRanking():vistaGaleria());
    return;
  }
  // Antes de entrar al juego no se repinta con los datos en directo:
  // así no se reinicia el dibujo ni se borra lo que alguien está escribiendo.
  const k = fase+"|"+mesaURL;
  if(app.dataset.k===k) return;
  app.dataset.k = k;
  if(!mesaURL || !MESAS[mesaURL]){ app.innerHTML = vistaElegirMesa(); return; }
  app.innerHTML = fase==="nombre"?vistaNombre():fase==="parentesco"?vistaParentesco():vistaBienvenida();
}

(async function init(){
  render();
  await cargar();
  if(yo && !S.jugadores[yo.id]){ yo=null; localStorage.removeItem("boda_cs_jugador"); fase="bienvenida"; }
  render();
  suscribir();
})();
</script>
